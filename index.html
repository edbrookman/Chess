<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Play Edward</title>
<link rel="icon" href="data:,">
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/ort.min.js"></script>
<style>
  :root{
    --bg:#fff; --ink:#1c1b19; --muted:#6f6c66; --line:#e2dfd9;
    --light:#eadfc8; --dark:#ad8968;
    --hl:rgba(205,210,106,.45); --sel:rgba(74,111,165,.38);
  }
  *{box-sizing:border-box}
  /* The board sizes itself to the SMALLER of the available width and height, so
     the page fits whatever box Google Sites gives the iframe and never scrolls. */
  html,body{height:100%;background:#fff;overflow:hidden}
  body{margin:0;color:var(--ink);display:flex;align-items:center;justify-content:center;
    font:15px/1.5 ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .wrap{padding:8px;width:100%;display:flex;justify-content:center}
  .stage{width:min(100% - 16px, calc(100dvh - 74px), 620px);display:flex;flex-direction:column}

  #board{container-type:inline-size;display:grid;
    grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);
    aspect-ratio:1;border-radius:6px;overflow:hidden;user-select:none;
    touch-action:manipulation;box-shadow:0 1px 3px rgba(0,0,0,.13),0 6px 18px rgba(0,0,0,.07)}
  .sq{position:relative;aspect-ratio:1;display:flex;align-items:center;justify-content:center;
    cursor:pointer;-webkit-tap-highlight-color:transparent}
  .sq.l{background:var(--light)} .sq.d{background:var(--dark)}
  .sq::after{content:"";position:absolute;inset:0;background:transparent;
    transition:background .12s;pointer-events:none}
  .sq.last::after{background:var(--hl)}
  .sq.sel::after{background:var(--sel)}
  .sq.chk::after{background:radial-gradient(circle,rgba(200,40,40,.72) 12%,transparent 72%)}
  @media (hover:hover){.sq.can:hover::after{background:rgba(255,255,255,.16)}}
  .piece{position:relative;z-index:2;font-size:9.2cqw;line-height:1;pointer-events:none;
    font-family:"Apple Symbols","Segoe UI Symbol","Noto Sans Symbols 2","DejaVu Sans",system-ui,sans-serif}
  .piece.w{color:#fcfcfa;
    text-shadow:0 0 1.5px #2a2724,0 0 1.5px #2a2724,0 0 1.5px #2a2724,0 2px 3px rgba(0,0,0,.4)}
  .piece.b{color:#26231f;text-shadow:0 0 1px rgba(255,255,255,.45),0 2px 3px rgba(0,0,0,.35)}
  .sq .dot{position:absolute;z-index:1;width:28%;height:28%;border-radius:50%;
    background:rgba(20,18,15,.26)}
  .sq .ring{position:absolute;z-index:1;inset:6%;border-radius:50%;
    border:.28em solid rgba(20,18,15,.26)}
  .coord{position:absolute;z-index:3;font-size:9.5px;font-weight:600;opacity:.5;letter-spacing:.02em}
  .coord.f{right:3px;bottom:1px} .coord.r{left:3px;top:1px}

  .bar{display:flex;gap:8px;align-items:center;margin-top:10px;min-width:0}
  select,button{font:inherit;padding:7px 12px;border-radius:7px;
    border:1px solid var(--line);background:#fff;color:var(--ink)}
  button{cursor:pointer;background:#3f6394;color:#fff;border-color:transparent;font-weight:600}
  button:hover{background:#35537d}
  #status{margin-left:auto;font-size:.88rem;color:var(--muted);text-align:right;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  @media (max-width:340px){#status{display:none}}
  select,button{flex:0 0 auto}
  #prog{height:3px;background:var(--line);border-radius:2px;overflow:hidden;
    margin-top:6px;display:none}
  #prog.on{display:block} #prog i{display:block;height:100%;width:0;background:#3f6394}
</style>
</head>
<body>
<div class="wrap"><div class="stage">
  <div id="board"></div>
  <div class="bar">
    <select id="side"><option value="w">I play White</option><option value="b">I play Black</option></select>
    <button id="new">New game</button>
    <span id="status"></span>
  </div>
  <div id="prog"><i></i></div>
</div></div>

<script type="module">
import { Chess } from "https://cdn.jsdelivr.net/npm/chess.js@1.0.0-beta.8/+esm";
import { Engine } from "./engine.js";

const GLYPH = {p:"♟",n:"♞",b:"♝",r:"♜",q:"♛",k:"♚"};
const $ = (id) => document.getElementById(id);
const boardEl = $("board");

let chess = new Chess(), engine = new Engine(), human = "w";
let sel = null, last = null, busy = false;

// Tuning knobs, settable from the URL so visitors never see them:
//   ?t=0.4          sampling temperature; lower is stronger, ~+200 Elo vs 0.9,
//                   saturating around 0.4 (measured over 40 self-play games)
//   ?style=attacking|positional|wild|stock
//   ?alpha=0.15     0 = pure Edward, up to 0.25 toward a generic 2000 player
const Q = new URLSearchParams(location.search);
const num = (k, d, lo, hi) => {
  const v = parseFloat(Q.get(k));
  return Number.isFinite(v) ? Math.min(hi, Math.max(lo, v)) : d;
};
//   ?veto=150       centipawn blunder filter; 0 turns it off
//   ?depth=6        Stockfish search depth for the filter
const OPTS = {
  temperature: num("t", 0.4, 0.02, 2),
  alpha: num("alpha", 0, 0, 0.25),
  veto: num("veto", 150, 0, 1000),
  depth: Math.round(num("depth", 6, 1, 14)),
  style: ["stock","attacking","positional","wild"].includes(Q.get("style"))
    ? Q.get("style") : "stock",
};

function squares() {
  const out = [];
  const ranks = human === "w" ? [8,7,6,5,4,3,2,1] : [1,2,3,4,5,6,7,8];
  const files = human === "w" ? "abcdefgh" : "hgfedcba";
  for (const r of ranks) for (const f of files) out.push(f + r);
  return out;
}

function render() {
  const board = {};
  for (const row of chess.board()) for (const p of row) if (p) board[p.square] = p;
  const moves = sel ? chess.moves({ square: sel, verbose: true }) : [];
  const targets = new Map(moves.map(m => [m.to, m.flags.includes("c") || m.flags.includes("e")]));
  const inCheck = chess.inCheck(), turn = chess.turn();
  boardEl.innerHTML = "";
  squares().forEach((sq, i) => {
    const file = sq.charCodeAt(0) - 97, rank = Number(sq[1]) - 1;
    const d = document.createElement("div");
    d.className = "sq " + ((file + rank) % 2 ? "l" : "d");
    const p = board[sq];
    if (sq === sel) d.classList.add("sel");
    if (last && (sq === last.from || sq === last.to)) d.classList.add("last");
    if (inCheck && p && p.type === "k" && p.color === turn) d.classList.add("chk");
    if (p && p.color === human && turn === human) d.classList.add("can");
    if (p) { const s = document.createElement("span");
      s.className = "piece " + p.color; s.textContent = GLYPH[p.type]; d.appendChild(s); }
    if (targets.has(sq)) { const o = document.createElement("i");
      o.className = targets.get(sq) ? "ring" : "dot"; d.appendChild(o); }
    if (i >= 56) { const c = document.createElement("span");
      c.className = "coord f"; c.textContent = sq[0]; d.appendChild(c); }
    if (i % 8 === 0) { const c = document.createElement("span");
      c.className = "coord r"; c.textContent = sq[1]; d.appendChild(c); }
    d.onclick = () => click(sq);
    boardEl.appendChild(d);
  });
}

const say = (t) => { $("status").textContent = t; };

function click(sq) {
  if (busy || chess.turn() !== human || chess.isGameOver()) return;
  if (sel) {
    const mv = chess.moves({ square: sel, verbose: true }).find(m => m.to === sq);
    if (mv) {
      chess.move({ from: sel, to: sq, promotion: "q" });
      last = { from: sel, to: sq }; sel = null; render();
      setTimeout(reply, 120);
      return;
    }
  }
  const piece = chess.get(sq);
  sel = (piece && piece.color === human) ? sq : null;
  render();
}

async function reply() {
  if (chess.isGameOver()) return finish();
  busy = true;
  const { uci, source } = await engine.chooseMove(chess, OPTS);
  if (!uci) { say("loading…"); busy = false; return; }
  const mv = chess.move({ from: uci.slice(0,2), to: uci.slice(2,4), promotion: uci[4] || "q" });
  last = { from: mv.from, to: mv.to };
  busy = false; render();
  document.body.dataset.source = source;   // handy when tuning
  chess.isGameOver() ? finish() : say("your move");
}

function finish() {
  say(chess.isCheckmate() ? (chess.turn() === human ? "I win" : "you win")
    : chess.isDraw() ? "draw" : "game over");
}

function newGame() {
  chess = new Chess(); human = $("side").value; sel = null; last = null;
  render(); say("your move");
  if (human === "b") setTimeout(reply, 200);
}

$("new").onclick = newGame;
$("side").onchange = newGame;

(async () => {
  render();
  await engine.loadLight();
  say("your move");
  const bar = $("prog"); bar.classList.add("on");
  await engine.loadModel(p => { bar.firstElementChild.style.width = (p*100).toFixed(0) + "%"; });
  setTimeout(() => bar.classList.remove("on"), 400);
  if (OPTS.veto > 0) await engine.loadVeto();
})();
</script>
</body>
</html>
